name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Origin only. SITE_BASE is appended by `absoluteUrl`, so putting the repo
      # path in SITE_URL too would emit /bossdanang/bossdanang/… everywhere.
      SITE_URL: https://tientdat11.github.io
      SITE_BASE: /bossdanang
      PUBLISH_APPROVED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Named explicitly, not only inside `npm run build`: Astro logs a render
      # error and still exits 0 for the pages that succeeded, so a build-only gate
      # can publish a site that is quietly missing routes.
      - run: node scripts/verify-build.mjs
        env:
          SITE_URL: https://tientdat11.github.io
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
